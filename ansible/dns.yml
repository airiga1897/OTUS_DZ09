---
- name: Create the controller scripts directory
  ansible.builtin.file:
    path: /usr/local/lib/otus-dz09
    state: directory
    mode: '0755'

- name: Install BIND configuration and TSIG key
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: bind
    mode: "{{ item.mode }}"
  loop:
    - {src: named-options.j2, dest: /etc/bind/named.conf.options, mode: '0644'}
    - {src: named-local.j2, dest: /etc/bind/named.conf.local, mode: '0644'}
    - {src: tsig.key.j2, dest: /etc/bind/otus-dz09.key, mode: '0640'}
  register: bind_config
  no_log: true

- name: Seed the BIND zone only before its first start
  ansible.builtin.template:
    src: zone.j2
    dest: /var/lib/bind/otus-dz09.zone
    owner: bind
    group: bind
    mode: '0640'
    force: false

- name: Validate BIND configuration and zone
  ansible.builtin.command: named-checkconf -z
  changed_when: false

- name: Start BIND
  ansible.builtin.systemd_service:
    name: named
    enabled: true
    state: "{{ 'restarted' if bind_config.changed else 'started' }}"

- name: Install DNS synchronizer
  ansible.builtin.copy:
    src: sync_dns.py
    dest: /usr/local/lib/otus-dz09/sync_dns.py
    mode: '0755'

- name: Write the allowed portal inventory
  ansible.builtin.template:
    src: sync.json.j2
    dest: /etc/otus-dz09/sync.json
    mode: '0644'

- name: Install DNS synchronization units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop: [otus-dns-sync.service, otus-dns-sync.timer]

- name: Enable automatic DNS synchronization
  ansible.builtin.systemd_service:
    name: otus-dns-sync.timer
    enabled: true
    state: started
    daemon_reload: true
